<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10151B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<title>NovelReader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: library -> series -> volume/character. One reading column, sticky header with the spoiler gate. */
:root{
  --bg:#F6F4F2; --surface:#FFFFFF; --sunk:#EFECE8; --ink:#1D2129; --muted:#5E6673; --faint:#8C93A0; --line:#E2DED9;
  --accent:#C9483F; --accent-soft:#F7E3E0; --gold:#9A6B12; --ok:#2E7D62; --lost:#9B3B34;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151B; --surface:#181D25; --sunk:#0D1015; --ink:#E7EAEE; --muted:#9AA3AF; --faint:#6B7480; --line:#272E38;
  --accent:#F07167; --accent-soft:#3A2224; --gold:#E2B653; --ok:#5CC6A0; --lost:#F08C84; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#181D25; --sunk:#0D1015; --ink:#E7EAEE; --muted:#9AA3AF; --faint:#6B7480; --line:#272E38;
  --accent:#F07167; --accent-soft:#3A2224; --gold:#E2B653; --ok:#5CC6A0; --lost:#F08C84; color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.6 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding-block:14px 80px}
.crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);min-height:28px;flex-wrap:wrap}
.crumbs button{background:none;border:none;padding:2px 0;color:var(--accent);font-weight:500}
.crumbs .sep{color:var(--faint)}
/* Sprint 13.2: shared theme tokens (same names in every app, mapped to this app's palette) and the back link */
:root{--lp-bg:var(--bg);--lp-surface:var(--surface);--lp-text:var(--ink);--lp-muted:var(--muted);--lp-accent:var(--accent)}
.lp-back{color:var(--lp-muted);text-decoration:none;font-weight:500}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font:700 clamp(28px,6vw,42px)/1.12 var(--f-display);margin:6px 0 4px;text-wrap:balance;letter-spacing:-.01em}
h2{font:600 21px/1.25 var(--f-display);margin:26px 0 10px;text-wrap:balance}
h3{font:600 12px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.sub{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.shelf button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* gate */
.gate{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:16px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px;border-bottom:1px solid var(--line)}
.gate-inner{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:4px}
.gate label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;color:var(--muted)}
.gate label b{color:var(--ink);font-weight:600}
.gate .val{font:500 13px var(--f-mono);color:var(--accent);white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--accent);height:22px;margin:0}
.tabs{display:flex;gap:4px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:none;background:none;padding:7px 12px;border-radius:999px;color:var(--muted);font:600 14px var(--f-body);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
/* library */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px;margin-top:16px}
.scard{display:grid;grid-template-columns:84px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;min-width:0}
.scard .t{font:600 18px/1.25 var(--f-display)}
.meter{height:6px;border-radius:4px;background:var(--sunk);overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;background:var(--accent)}
.cover{aspect-ratio:480/680;width:100%;border-radius:6px;background:var(--sunk);object-fit:cover;display:block;max-width:100%}
.ph{aspect-ratio:480/680;width:100%;border-radius:6px;display:flex;flex-direction:column;justify-content:space-between;padding:8px;background:linear-gradient(160deg,var(--sunk),var(--surface));border:1px solid var(--line);color:var(--muted);font:600 12px/1.2 var(--f-display);overflow:hidden}
.ph .n{font:500 22px/1 var(--f-mono);color:var(--faint)}
/* series */
.hero{display:grid;grid-template-columns:min(140px,32vw) 1fr;gap:18px;align-items:start;margin-top:8px}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13.5px;color:var(--muted)}
.stats b{display:block;font:600 20px/1.2 var(--f-display);color:var(--ink)}
.get{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font:500 12.5px/1 var(--f-body);border-radius:999px;padding:6px 10px;border:1px dashed var(--accent);color:var(--accent);background:var(--accent-soft)}
.pill.jp{border-color:var(--line);color:var(--muted);background:var(--sunk)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px;margin-top:12px}
.shelf button{background:none;border:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0}
.shelf .cap{font-size:11.5px;line-height:1.3;color:var(--muted)}
.shelf .cap b{color:var(--ink);font-weight:600}
.shelf .missing .ph{border-style:dashed;background:none}
.shelf .unread img,.shelf .unread .ph{opacity:.55}
.tag{font:600 10px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.tag.ok{color:var(--ok)} .tag.own{color:var(--faint)} .tag.miss{color:var(--accent)}
/* shared content */
.recap{font:400 17px/1.7 var(--f-display);max-width:65ch}
.recap p{margin:0 0 12px}
.locked{border:1px dashed var(--line);border-radius:12px;padding:14px 16px;color:var(--muted);font-size:14px;margin-top:14px}
details.chap{border-bottom:1px solid var(--line)}
details.chap summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:baseline;padding:12px 2px}
details.chap summary::-webkit-details-marker{display:none}
.num{font:500 13px var(--f-mono);color:var(--accent)}
.ctitle{font:600 16.5px/1.35 var(--f-display)}
.cwhere{font-size:12.5px;color:var(--faint);white-space:nowrap}
.cbody{padding:0 2px 16px 54px;max-width:calc(65ch + 54px)}
.cbody p{margin:0 0 8px}
.cbody ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:14.5px}
.search{margin-top:14px;width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;font:500 13px var(--f-body)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:6px}
.pcard{display:grid;grid-template-columns:64px 1fr;gap:12px;text-align:left;width:100%}
.portrait{width:64px;height:84px;border-radius:8px;object-fit:cover;background:var(--sunk);display:flex;align-items:center;justify-content:center;font:600 24px var(--f-display);color:var(--faint);overflow:hidden}
.name{font:600 18px/1.25 var(--f-display)}
.aka{font-size:13px;color:var(--muted)}
.status{align-self:flex-start;font:600 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:6px;border:1px solid currentColor}
.status.alive{color:var(--ok)} .status.dead{color:var(--lost)} .status.unknown{color:var(--gold)}
.facts{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.facts li{display:grid;grid-template-columns:68px 1fr;gap:8px}
.facts .at{font:500 11.5px var(--f-mono);color:var(--faint);padding-top:2px}
.new{font:600 10.5px/1 var(--f-mono);color:var(--accent);margin-left:6px;letter-spacing:.06em}
.kind{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.timeline{list-style:none;margin:10px 0 0;padding:0;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 18px 18px}
.timeline li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.timeline .when{font:500 12.5px var(--f-mono);color:var(--accent)}
.timeline .src{font-size:12px;color:var(--faint)}
.empty{color:var(--muted);padding:20px 0}
/* character */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.art{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.art img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--sunk);display:block}
.art .meta{padding:7px 9px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.art .meta b{color:var(--ink);font-weight:600}
.art .x{align-self:flex-start;background:none;border:none;padding:0;color:var(--faint);font-size:12px;text-decoration:underline}
.hidden-note{font-size:13px;color:var(--faint);margin-top:8px}
/* sheet + toast */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin-top:0}
.field{margin-top:12px;display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--muted)}
.field input,.field select,.field textarea{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100vw - 32px)}
#auth{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
[hidden]{display:none!important}
#auth .box{max-width:360px;width:100%;text-align:center}
#auth .btn{width:100%;margin-top:10px}
@media (max-width:540px){.cbody{padding-left:2px}.cwhere{display:none}details.chap summary{grid-template-columns:36px 1fr}}
</style>

</head>

<script>
/* ============================== CONFIG ============================== */
const CLIENT_ID = '669494100250-gvromuq72r7j0djmkd4vdbdq5damncj7.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/drive.file';
const API = 'https://www.googleapis.com/drive/v3/files';
const UPLOAD = 'https://www.googleapis.com/upload/drive/v3/files';
const DATA_FILE = 'novelreader-data.json';
const FOLDER = 'NovelReader';
// Demo mode: the preview page injects window.NR_DEMO; the real app never ships book content.
const DEMO = !!window.NR_DEMO;
const LS = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fold = s => String(s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9 ]/g, '');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');

/* ============================== STATE ==============================
 data = { app, version, series:[{ id, title, author, note, volumes:[{ n, subtitle, jp, en, owned, notesFileId, coverFileId }] }],
          progress:{ [seriesId]: { v, ch } }, art:[{ id, seriesId, charId, fileId, thumbFileId, tag:{kind:'volume',v}|{kind:'fanart'}, caption, added }],
          upcoming:[] }
 packs: Map 'sid:n' -> volume pack (notes), loaded from Drive on demand */
let data = null, fileId = null, folderId = null;
const packs = new Map();
const imgCache = new Map();          // Drive fileId or 'pack:sid:n' -> object/data URL
let ROUTE = { view: 'library' };     // library | series | volume | character
let TAB = { series: 'people', volume: 'story' };
let FILTER = { group: 'All', kind: 'All', q: '' };

/* ============================== SPOILER GATE ============================== */
const prog = sid => data.progress[sid] || { v: 0, ch: 0 };
function visible(sid, v, ch) { const p = prog(sid); return v < p.v || (v === p.v && ch <= p.ch); }
function chaptersOf(sid, n) { const pk = packs.get(sid + ':' + n); return pk ? pk.volume.chapters : 999; }

/* ============================== CONSOLIDATION ============================== */
function processedVols(s) { return s.volumes.filter(v => v.notesFileId || packs.has(s.id + ':' + v.n)).map(v => v.n).sort((a, b) => a - b); }
function seriesPacks(s) { return processedVols(s).map(n => packs.get(s.id + ':' + n)).filter(Boolean); }
function consolidatePeople(s, onlyVol) {
  const out = new Map();
  for (const pk of seriesPacks(s)) {
    const n = pk.volume.n;
    if (onlyVol && n !== onlyVol) continue;
    for (const p of pk.people) {
      if (!visible(s.id, n, p.from)) continue;
      let e = out.get(p.id);
      if (!e) { e = { id: p.id, firstSeen: [n, p.from], aka: [], facts: [], status: [] }; out.set(p.id, e); }
      Object.assign(e, { name: p.name, group: p.group, role: p.role, lastVol: n });
      (p.aka || []).forEach(a => visible(s.id, n, a[0]) && e.aka.push([n, a[0], a[1]]));
      p.facts.forEach(f => visible(s.id, n, f[0]) && e.facts.push([n, f[0], f[1]]));
      p.status.forEach(st => visible(s.id, n, st[0]) && e.status.push([n, st[0], st[1], st[2]]));
    }
  }
  return [...out.values()];
}
function consolidateTerms(s, onlyVol) {
  const out = new Map();
  for (const pk of seriesPacks(s)) {
    const n = pk.volume.n;
    if (onlyVol && n !== onlyVol) continue;
    for (const t of pk.terms) {
      if (!visible(s.id, n, t.at)) continue;
      const k = fold(t.name);
      const e = out.get(k);
      if (!e) out.set(k, { name: t.name, kind: t.kind, text: t.text, first: [n, t.at], updated: null });
      else { e.text = t.text; e.updated = [n, t.at]; }
    }
  }
  return [...out.values()];
}
function consolidateTimeline(s, onlyVol) {
  const out = [];
  for (const pk of seriesPacks(s)) {
    const n = pk.volume.n;
    if (onlyVol && n !== onlyVol) continue;
    pk.timeline.forEach(e => visible(s.id, n, e.at) && out.push({ ...e, v: n }));
  }
  return out;
}
const isNew = (sid, v, ch) => { const p = prog(sid); return v === p.v && ch === p.ch && ch > 0; };

/* ============================== IMAGES ============================== */
async function imgUrl(key) {
  if (imgCache.has(key)) return imgCache.get(key);
  if (key.startsWith('pack:')) { const pk = packs.get(key.slice(5)); return pk && pk.cover; }
  if (DEMO) return null;
  const r = await dfetch(`${API}/${key}?alt=media`);
  const url = URL.createObjectURL(await r.blob());
  imgCache.set(key, url); return url;
}
function hydrateImages() {
  document.querySelectorAll('img[data-img]').forEach(async el => {
    try { const u = await imgUrl(el.dataset.img); if (u) el.src = u; } catch (e) { console.warn('image', e); }
  });
}
function coverKey(s, v) { return v.coverFileId || (packs.get(s.id + ':' + v.n)?.cover ? 'pack:' + s.id + ':' + v.n : null); }
function coverEl(s, v, cls = 'cover') {
  const key = coverKey(s, v);
  if (key) return `<img class="${cls}" data-img="${esc(key)}" alt="${esc(s.title)} volume ${v.n} cover">`;
  return `<div class="ph"><span class="n">${pad(v.n)}</span><span>${esc(v.subtitle || s.title)}</span></div>`;
}

/* ============================== VIEWS ============================== */
function go(view, args = {}) { ROUTE = { view, ...args }; FILTER = { group: 'All', kind: 'All', q: '' }; render(); window.scrollTo(0, 0); }
function crumbs() {
  const s = ROUTE.sid && getSeries(ROUTE.sid);
  const parts = [`<button onclick="go('library')">Library</button>`];
  if (s && ROUTE.view !== 'series') parts.push(`<span class="sep">/</span><button onclick="go('series',{sid:'${s.id}'})">${esc(s.title)}</button>`);

function gate(sid, kind, n) {
  const p = prog(sid), s = getSeries(sid);
  if (kind === 'series') {
    const max = Math.max(1, ...processedVols(s), p.v);
    const label = p.v === 0 ? 'nothing yet' : `volume ${p.v}${p.ch < chaptersOf(sid, p.v) ? `, chapter ${p.ch}` : ''}`;
    return `<div class="gate"><div class="gate-inner"><label for="gate-v"><span>I've read up to <b>${label}</b></span><span class="val">${p.v ? 'Vol ' + p.v : 'Start'}</span></label>
      <input type="range" id="gate-v" min="0" max="${max}" value="${Math.min(p.v, max)}" oninput="this.closest('.gate-inner').querySelector('.val').textContent=+this.value?'Vol '+this.value:'Start'" onchange="setVol('${sid}',this.value)">
      <div class="tabs" role="tablist">${[['people', "Who's who"], ['terms', "What's what"], ['timeline', 'Timeline'], ['shelf', 'Shelf']].map(([k, l]) => `<button class="tab" role="tab" aria-selected="${TAB.series === k}" onclick="TAB.series='${k}';render()">${l}</button>`).join('')}</div></div></div>`;
  }
  const chs = chaptersOf(sid, n);
  const val = p.v > n ? chs : p.v < n ? 0 : Math.min(p.ch, chs);
  return `<div class="gate"><div class="gate-inner"><label for="gate-c"><span>In volume ${n}, I've read up to <b>${val === chs ? 'the end' : val === 0 ? 'nothing yet' : 'chapter ' + val}</b></span><span class="val">${val ? 'Ch ' + val : 'Start'}</span></label>
    <input type="range" id="gate-c" min="0" max="${chs}" value="${val}" oninput="this.closest('.gate-inner').querySelector('.val').textContent=+this.value?'Ch '+this.value:'Start'" onchange="setCh('${sid}',${n},this.value)">
    <div class="tabs" role="tablist">${[['story', 'Story'], ['people', "Who's who"], ['terms', "What's what"], ['timeline', 'Timeline']].map(([k, l]) => `<button class="tab" role="tab" aria-selected="${TAB.volume === k}" onclick="TAB.volume='${k}';render()">${l}</button>`).join('')}</div></div></div>`;
}
function setVol(sid, v) { v = +v; data.progress[sid] = { v, ch: v ? chaptersOf(sid, v) : 0 }; save(); render(true); }
function setCh(sid, n, ch) { ch = +ch; data.progress[sid] = ch === 0 ? { v: n - 1, ch: n > 1 ? chaptersOf(sid, n - 1) : 0 } : { v: n, ch }; save(); render(true); }

function shrink(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('Could not read that image')), 'image/jpeg', q);
    };
    img.onerror = () => rej(new Error('Could not read that image'));
    img.src = url;
  });
}
async function addArt(sid, cid, file, tag, caption) {
  const id = uid();
  const full = await shrink(file, 1800, 0.88), thumb = await shrink(file, 420, 0.82);
  const rec = { id, seriesId: sid, charId: cid, tag, caption, added: new Date().toISOString().slice(0, 10) };
  if (DEMO) { rec.localUrl = URL.createObjectURL(full); imgCache.set('local:' + id, URL.createObjectURL(thumb)); }
  else {
    rec.fileId = await uploadBlob(`nr-art-${sid}-${cid}-${id}.jpg`, full, 'image/jpeg');
    rec.thumbFileId = await uploadBlob(`nr-art-${sid}-${cid}-${id}-thumb.jpg`, thumb, 'image/jpeg');
  }
  data.art.push(rec);
}
async function removeArt(id) {
  const a = data.art.find(x => x.id === id); if (!a) return;
  data.art = data.art.filter(x => x.id !== id);
  if (!DEMO) for (const f of [a.fileId, a.thumbFileId].filter(Boolean)) { try { await dfetch(`${API}/${f}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ trashed: true }) }); } catch (e) {} }
  await save(); render(true); toast('Picture removed (it is in your Drive trash for 30 days)');
}

$('#pack-input').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  let n = 0;
  for (const f of files) {
    try { const j = JSON.parse(await f.text()); await importPack(j); n++; }
    catch (err) { console.error(err); toast(`${f.name}: ${err.message}`); }
  }
  if (n) { await save(); render(); toast(`Imported ${n} file${n > 1 ? 's' : ''}`); }
});
function upsertSeries(info) {
  let s = getSeries(info.id);
  if (!s) { s = { id: info.id, title: info.title, author: info.author || '', note: '', volumes: [] }; data.series.push(s); }
  Object.assign(s, { title: info.title || s.title, author: info.author || s.author, note: info.note ?? s.note });
  return s;
}
async function importPack(j) {
  if (j.format === 'novelreader-series') {
    const s = upsertSeries(j.series);
    for (const v of j.series.volumes) {
      const cur = s.volumes.find(x => x.n === v.n);
      if (cur) Object.assign(cur, { subtitle: v.subtitle, jp: v.jp, en: v.en, owned: v.owned ?? cur.owned });
      else s.volumes.push({ n: v.n, subtitle: v.subtitle, jp: v.jp, en: v.en, owned: !!v.owned });
    }
    s.volumes.sort((a, b) => a.n - b.n);
    return;
  }
  if (j.format !== 'novelreader-volume') throw new Error('Not a NovelReader pack');
  const s = upsertSeries(j.series);
  let v = s.volumes.find(x => x.n === j.volume.n);
  if (!v) { v = { n: j.volume.n, subtitle: j.volume.subtitle }; s.volumes.push(v); s.volumes.sort((a, b) => a.n - b.n); }
  v.owned = true; v.subtitle = j.volume.subtitle;
  const cover = j.cover; const notes = { ...j }; delete notes.cover;
  if (!DEMO) {
    if (cover) v.coverFileId = await uploadBlob(`novelreader-${s.id}-v${pad(v.n)}-cover.jpg`, await (await fetch(cover)).blob(), 'image/jpeg', v.coverFileId);
    v.notesFileId = await uploadBlob(`novelreader-${s.id}-v${pad(v.n)}.json`, new Blob([JSON.stringify(notes)], { type: 'application/json' }), 'application/json', v.notesFileId);
  }
  packs.set(s.id + ':' + v.n, j);
  if (!data.progress[s.id]) data.progress[s.id] = { v: 0, ch: 0 };
}
async function ensurePack(sid, n) {
  const k = sid + ':' + n;
  if (packs.has(k)) return packs.get(k);
  const v = getSeries(sid).volumes.find(x => x.n === n);
  if (!v || !v.notesFileId || DEMO) return null;
  const pk = await (await dfetch(`${API}/${v.notesFileId}?alt=media`)).json();
  packs.set(k, pk); return pk;
}
async function loadAllPacks() {
  const jobs = [];
  for (const s of data.series) for (const v of s.volumes) if (v.notesFileId) jobs.push(ensurePack(s.id, v.n).catch(e => console.warn('pack', s.id, v.n, e)));
  await Promise.all(jobs);
}

/* ============================== SHEET / TOAST ============================== */
function sheet(html) { closeSheet(); const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'sheet-bg'; bg.innerHTML = `<div class="sheet">${html}</div>`; bg.onclick = e => { if (e.target === bg) closeSheet(); }; document.body.appendChild(bg); }
function closeSheet() { $('#sheet-bg')?.remove(); }
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }

/* ============================== GOOGLE AUTH + DRIVE ============================== */
let tokenClient = null, accessToken = null;
const savedTok = () => { try { return JSON.parse(LS.get('nr-token') || 'null'); } catch (e) { return null; } };
function keepToken(t, exp) { accessToken = t; LS.set('nr-token', JSON.stringify({ t, exp: Date.now() + (Number(exp) || 3599) * 1000, email: (savedTok() || {}).email || '' })); ssoPublish(t, exp); }
/* Shared sign-in with Life Plan and the other apps (Sprint 13.4). All apps share the origin https://marvyeo.github.io,
   so localStorage is shared. Key `lp-sso` = { t, exp, email, scope, client }. Only a drive.file token for the shared client. */
const SSO_KEY = 'lp-sso';
function ssoPublish(t, exp) {
  let email = ''; try { email = (JSON.parse(LS.get(SSO_KEY) || 'null') || {}).email || ''; } catch (e) {}
  LS.set(SSO_KEY, JSON.stringify({ t, exp: Date.now() + (Number(exp) || 3599) * 1000, email, scope: SCOPE, client: CLIENT_ID }));
}
function ssoClear() { LS.del(SSO_KEY); }
function ssoRead() { try { const x = JSON.parse(LS.get(SSO_KEY) || 'null'); return x && x.t && x.client === CLIENT_ID && x.scope === SCOPE && x.exp > Date.now() + 60000 ? x : null; } catch (e) { return null; } }
function authScreen(msg) { $('#auth').hidden = false; $('#auth-msg').textContent = msg || ''; const t = savedTok(); $('#signin').textContent = t && t.email ? 'Continue as ' + t.email : 'Sign in with Google'; }
function waitGsi() {
  if (typeof google === 'undefined' || !google.accounts) { setTimeout(waitGsi, 120); return; }
  tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPE, callback: r => { if (r.error) { authScreen('Sign-in was cancelled.'); return; } keepToken(r.access_token, r.expires_in); start(); } });
}
function signIn() { if (!tokenClient) return; const t = savedTok(); tokenClient.requestAccessToken(t && t.email ? { prompt: '', login_hint: t.email } : { prompt: 'consent' }); }
// iPhone home-screen fallback; needs https://marvyeo.github.io/NovelReader/ under Authorized redirect URIs.
const REDIRECT_URI = location.origin + location.pathname;
function redirectSignIn() { location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + new URLSearchParams({ client_id: CLIENT_ID, redirect_uri: REDIRECT_URI, response_type: 'token', scope: SCOPE, include_granted_scopes: 'true', prompt: 'select_account', state: 'novelreader' }); }
function consumeRedirect() {
  if (!location.hash.includes('access_token=')) return false;
  const h = new URLSearchParams(location.hash.slice(1)); history.replaceState(null, '', REDIRECT_URI);
  if (h.get('state') !== 'novelreader' || !h.get('access_token')) return false;
  keepToken(h.get('access_token'), h.get('expires_in')); return true;
}
// No token revoke: every app shares one OAuth client, and revoking would cancel the file grants for all of them.
function signOut() { LS.del('nr-token'); ssoClear(); location.reload(); }
async function dfetch(url, opts = {}) {
  const r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: `Bearer ${accessToken}` } });
  if (r.status === 401) { ssoClear(); const t = savedTok(); if (t) { t.exp = 0; LS.set('nr-token', JSON.stringify(t)); } authScreen('Your Google session timed out. Tap to continue; nothing is lost.'); throw new Error('session expired'); }
  if (!r.ok) throw new Error(`Drive ${r.status}`);
  return r;
}
async function findByName(name, extra = '') {
  const q = encodeURIComponent(`name='${name}' and trashed=false${extra}`);
  const j = await (await dfetch(`${API}?q=${q}&orderBy=modifiedTime desc&fields=files(id)`)).json();
  return (j.files || [])[0]?.id || null;
}
async function ensureFolder() {
  folderId = await findByName(FOLDER, " and mimeType='application/vnd.google-apps.folder'");
  if (folderId) return;
  const j = await (await dfetch(`${API}?fields=id`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: FOLDER, mimeType: 'application/vnd.google-apps.folder' }) })).json();
  folderId = j.id;
}
async function uploadBlob(name, blob, mime, existingId) {
  if (existingId) { await dfetch(`${UPLOAD}/${existingId}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': mime }, body: blob }); return existingId; }
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify({ name, mimeType: mime, parents: folderId ? [folderId] : undefined })], { type: 'application/json' }));
  form.append('file', blob);
  return (await (await dfetch(`${UPLOAD}?uploadType=multipart&fields=id`, { method: 'POST', body: form })).json()).id;
}
function normalise(d) { d = d || {}; d.app = 'novelreader'; d.version = 1; d.series = d.series || []; d.progress = d.progress || {}; d.art = d.art || []; d.upcoming = []; return d; }
let saving = null;
async function save() {
  if (DEMO) return;
  const body = JSON.stringify({ ...data, art: data.art.map(({ localUrl, ...a }) => a) });
  saving = (async () => { fileId = await uploadBlob(DATA_FILE, new Blob([body], { type: 'application/json' }), 'application/json', fileId); })();
  try { await saving; } catch (e) { console.error(e); toast('Not saved: ' + e.message); }
}
async function start() {
  $('#auth').hidden = true;
  $('#app').innerHTML = '<p class="empty">Opening your library…</p>';
  try {
    const me = await (await dfetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)')).json();
    const t = savedTok() || {}; t.email = me.user?.emailAddress || ''; LS.set('nr-token', JSON.stringify(t));
    await ensureFolder();
    fileId = await findByName(DATA_FILE);
    data = normalise(fileId ? await (await dfetch(`${API}/${fileId}?alt=media`)).json() : null);
    if (!fileId) await save();
    await loadAllPacks();
    route(); render();
  } catch (e) { if (!String(e.message).includes('session')) { console.error(e); $('#app').innerHTML = `<p class="empty">Couldn't open your library: ${esc(e.message)}. Check your connection and reload.</p>`; } }
}
function route() {
  const h = location.hash.slice(1);
  const m = h.match(/^(series|vol|char)-([a-z0-9]+)(?:-([a-z0-9]+))?$/);
  if (!m || !getSeries(m[2])) return;
  if (m[1] === 'series') ROUTE = { view: 'series', sid: m[2] };
  else if (m[1] === 'vol') ROUTE = { view: 'volume', sid: m[2], n: +m[3] };
  else ROUTE = { view: 'character', sid: m[2], cid: m[3] };
}

/* ============================== BOOT ============================== */
if (DEMO) {
  data = normalise(window.NR_DEMO.data);
  (window.NR_DEMO.packs || []).forEach(pk => packs.set(pk.series.id + ':' + pk.volume.n, pk));
  imgUrl = async key => key.startsWith('pack:') ? packs.get(key.slice(5))?.cover : imgCache.get(key) || null;
  route(); render();
} else {
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  const redirected = consumeRedirect();
  const t = savedTok();
  const shared = ssoRead(); // signed in through Life Plan or another app: no second sign-in
  if (redirected || (t && t.t && t.exp > Date.now() + 60000)) { if (!redirected) accessToken = t.t; start(); }
  else if (shared) { accessToken = shared.t; LS.set('nr-token', JSON.stringify({ t: shared.t, exp: shared.exp, email: (t && t.email) || shared.email || '' })); start(); }
  else authScreen('');
  waitGsi();
}
</script>
